name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - 'envs/**'
      - 'modules/**'

jobs:
  apply-dev:
    name: "Déploiement Dev"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./envs/dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: "us-east-1"
      TF_VAR_db_password: "dummy_password_for_apply"
      TF_VAR_owner: "gna" # Modifie avec ton trigramme si besoin

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Création d'une clé SSH temporaire pour CI
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/novasphere -N ""
      - run: terraform init
      - run: terraform apply -auto-approve

  apply-prod:
    name: "Déploiement Prod"
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod # Lie ce job à l'environnement protégé créé à l'étape 1
    defaults:
      run:
        working-directory: ./envs/prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: "us-east-1"
      TF_VAR_db_password: "dummy_password_for_apply"
      TF_VAR_owner: "gna" # Modifie avec ton trigramme si besoin

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Création d'une clé SSH temporaire pour CI
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/novasphere -N ""
      - run: terraform init
      - run: terraform apply -auto-approve
